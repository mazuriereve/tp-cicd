name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Vérifier la qualité du code (flake8)
        run: |
          flake8 app.py test_app.py

      - name: Lancer les tests
        run: |
          pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construire l'image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tp-cicd:latest \
                       -t ${{ secrets.DOCKER_USERNAME }}/tp-cicd:${{ github.sha }} .

      - name: Publier l'image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tp-cicd:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/tp-cicd:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement
        run: |
          echo "Déploiement de l'image ${{ secrets.DOCKER_USERNAME }}/tp-cicd:latest"

      - name: Notification d'échec
        if: failure()
        run: |
          echo "Le pipeline a échoué"

